services:
  app:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    ipc: host
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    command: sh -c "npm ci && npm run serve -- --host 0.0.0.0"

volumes:
  node_modules:
