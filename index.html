<!doctype html>
<html lang="en">
  <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="color-scheme" content="light">
      <title>Decision calculator</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
      <link rel="stylesheet" href="css/main.css">
  </head>
  <body>
    <header class="app-bar">
      <h1>Decision calculator</h1>
    </header>
    <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg">
      <symbol id="icon-info" viewBox="0 0 24 24">
        <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </symbol>
    </svg>
    <main class="page">
      <p class="lede">Name both decisions to compare, list the pros and cons, then calculate which leads and by how many points.</p>

      <form>
          <div class="decision-table decision-table-grid">
              <div class="col-head">Decision</div>
              <div class="col-head">
                Pros <button type="button" class="hint" aria-label="About pros">
                  <svg aria-hidden="true"><use href="#icon-info"/></svg>
                  <span class="hint-text">Benefits, advantages, positives.</span>
                </button>
                <div class="col-head-metric">Importance / positive impact (0–10) <button type="button" class="hint" aria-label="About importance">
                  <svg aria-hidden="true"><use href="#icon-info"/></svg>
                  <span class="hint-text">How important is this to you? How much could this affect your life positively? (On a scale of 1–10.)</span>
                </button></div>
              </div>
              <div class="col-head">
                Cons <button type="button" class="hint hint-con" aria-label="About cons">
                  <svg aria-hidden="true"><use href="#icon-info"/></svg>
                  <span class="hint-text">Concerns, worries, possible liabilities.</span>
                </button>
                <div class="col-head-metric">Concern / negative impact (0–10) <button type="button" class="hint hint-con" aria-label="About concern">
                  <svg aria-hidden="true"><use href="#icon-info"/></svg>
                  <span class="hint-text" id="concern-hint">How much does this worry or concern you? How much could this affect your life negatively? (On a scale of 1–10.)</span>
                </button></div>
              </div>

              <div class="decision-name">
                <input id="A" type="text" maxlength="50" placeholder="Enter decision" aria-label="Decision A" aria-describedby="A-error" autocomplete="off" />
                <p id="A-error" class="field-error" hidden></p>
              </div>
              <div class="list" data-group="prosA" data-kind="pro">
                <div class="consideration-rows"></div>
                <button type="button" class="add-row" data-group="prosA" aria-label="Add a pro for decision A">Add pro</button>
              </div>
              <div class="list" data-group="consA" data-kind="con">
                <div class="consideration-rows"></div>
                <button type="button" class="add-row" data-group="consA" aria-label="Add a con for decision A">Add con</button>
              </div>

              <div class="decision-name">
                <input id="B" type="text" maxlength="50" placeholder="Enter decision" aria-label="Decision B" aria-describedby="B-error" autocomplete="off" />
                <p id="B-error" class="field-error" hidden></p>
              </div>
              <div class="list" data-group="prosB" data-kind="pro">
                <div class="consideration-rows"></div>
                <button type="button" class="add-row" data-group="prosB" aria-label="Add a pro for decision B">Add pro</button>
              </div>
              <div class="list" data-group="consB" data-kind="con">
                <div class="consideration-rows"></div>
                <button type="button" class="add-row" data-group="consB" aria-label="Add a con for decision B">Add con</button>
              </div>
          </div>
          <div class="actions">
            <div class="action-buttons">
              <button type="button" class="button" onclick="calculate()">Calculate</button>
              <button type="button" id="save-decisions" class="button button-secondary"></button>
              <button type="button" id="load-decisions" class="button button-secondary"></button>
              <input id="load-decisions-file" type="file" accept=".json,application/json" hidden>
              <button type="reset" class="button button-secondary" onclick="resetSliders()">Reset</button>
              <p id="load-decisions-status" class="load-status" role="status"></p>
              <p id="load-decisions-error" class="load-error" role="alert" hidden></p>
            </div>
            <div class="model-choice">
              <label id="model-label" for="model">Try a different model:</label>
              <div class="custom-dropdown" id="model-dropdown">
                <button
                  type="button"
                  id="model-trigger"
                  class="custom-dropdown-trigger"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                  aria-labelledby="model-label model-trigger-text"
                >
                  <span id="model-trigger-text" class="custom-dropdown-label">Squared</span>
                  <svg class="custom-dropdown-arrow" aria-hidden="true" viewBox="0 0 24 24">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </button>
                <ul
                  id="model-menu"
                  class="custom-dropdown-menu"
                  role="listbox"
                  aria-labelledby="model-label"
                  tabindex="-1"
                  hidden
                ></ul>
                <select id="model" aria-describedby="model-hint" class="visually-hidden" tabindex="-1"></select>
              </div>
              <p id="model-hint" class="model-hint"></p>
            </div>
          </div>
      </form>

      <template id="consideration-row">
        <div class="consideration-row">
          <div class="consideration-text">
            <input type="text" />
            <p class="field-error" hidden></p>
          </div>
          <div class="slider-well">
            <input class="sliders" type="range" min="0" max="10" value="0" step="1" />
            <label class="slider-readout"><span class="slider-readout-label">Value: </span><input class="sliderStatus" type="number" inputmode="numeric" min="0" max="10" step="1" value="0" aria-label="Value" /></label>
          </div>
          <button type="button" class="remove-row" title="Remove">
            <svg aria-hidden="true"><use href="#icon-close"/></svg>
            <span class="remove-tooltip">Remove</span>
          </button>
        </div>
      </template>

      <div id="finalResult" class="result" aria-live="polite"></div>

      <dialog id="validation-dialog" class="dialog" aria-labelledby="validation-dialog-title">
        <h2 id="validation-dialog-title" class="dialog-title"></h2>
        <div class="validation-errors"></div>
        <button type="button" class="button dialog-dismiss"></button>
      </dialog>
    </main>
    
    <script type="module">
      import { initApp } from "./js/scripts.js";
      initApp();
    </script>
  </body>
</html>
